# Deploys a demo of the site to GitHub Pages on every push to main.
#
# This is the PREVIEW pipeline, not production: the built output is rewritten
# for the /TFM/ subpath and stamped noindex (see scripts/apply-base.mjs).
# Production goes to a real domain from an untouched `npm run build`.
#
# Note: CI runs on Linux, where the native Astro/Tailwind/Rollup binaries load
# normally — the WASM fallback used on the Windows dev machine no-ops here.

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Rewrite for the /TFM/ subpath and mark noindex
        run: node scripts/apply-base.mjs /TFM

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
